name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm audit:architecture
      - run: pnpm audit:product
      - run: pnpm audit:docs
      - run: pnpm audit:maintainability
      - run: pnpm audit:summary
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm audit:artifacts
      - run: pnpm test --maxWorkers=2
        if: runner.os == 'Windows'
      - run: pnpm test:launcher
        if: runner.os == 'Windows'
      - run: pnpm exec playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: pnpm test:coverage --maxWorkers=2
        if: runner.os == 'Linux'
      - run: pnpm benchmark:context-cost
        if: runner.os == 'Linux'
      - run: pnpm test:e2e
        if: runner.os == 'Linux'
      - run: pnpm audit --prod --audit-level high
