name: CI

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Codex kit installation and configuration
        run: pnpm test:kit
      - name: Test Bash kit installation and configuration
        run: bash frontend-codex-kit/test-shell-kit.sh
        if: runner.os == 'Linux'
      - name: Static gates, build, typecheck, and artifact audit
        run: pnpm check:ci
      - name: Smoke-test the built core MCP over stdio
        run: node frontend-codex-kit/smoke-core-mcp.mjs packages/mcp/dist/index.js
      - name: Test unit and integration contracts
        run: pnpm test:unit:built --maxWorkers=2
        if: runner.os == 'Windows'
      - name: Test product launcher
        run: pnpm test:launcher:built
      - name: Test coverage
        run: pnpm test:coverage:built --maxWorkers=2
        if: runner.os == 'Linux'
      - name: Benchmark context cost
        run: pnpm benchmark:context-cost:built
        if: runner.os == 'Linux'
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - name: Test end-to-end smoke flows
        run: pnpm test:e2e:built
        if: runner.os == 'Linux'
      - name: Upload end-to-end failure evidence
        uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Linux'
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
        if: runner.os == 'Linux'

  arch-kit:
    name: Validate native installer (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 30
    steps:
      - name: Install Arch dependencies
        run: pacman -Syu --noconfirm git nodejs-lts-krypton pnpm openai-codex
      - uses: actions/checkout@v4
      - name: Install and diagnose the real product on Arch
        shell: bash
        env:
          HOME: ${{ runner.temp }}/project-atlas-home
          CODEX_HOME: ${{ runner.temp }}/project-atlas-codex
          XDG_DATA_HOME: ${{ runner.temp }}/project-atlas-data
        run: |
          mkdir -p "$HOME"
          bash ./frontend-codex-kit/install.sh --agent codex
          bash ./frontend-codex-kit/doctor.sh
      - name: Test Bash kit installation and configuration
        run: bash frontend-codex-kit/test-shell-kit.sh
